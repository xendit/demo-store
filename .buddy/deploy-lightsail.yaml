- pipeline: "Deploy to Lightsail"
  trigger_mode: "ON_EVERY_PUSH"
  ref_name: '(refs/tags/v\d{0,3}\.\d{0,3}\.\d{0,3}$)'
  ref_type: "WILDCARD"
  trigger_condition: "ALWAYS"
  targets:
    - target: lightsail-server
      type: SSH
      name: lightsail-server
      host: $LIGHTSAIL_HOST
      auth:
        method: ASSETS_KEY
        username: admin
        asset: LIGHTSAIL_SSH_KEY
      use_as:
        target: on
  actions:
    - action: "Install dependencies & build"
      type: "BUILD"
      docker_image_name: "library/node"
      docker_image_tag: "20"
      execute_commands:
        - npm ci
        - npm run build
      cached_dirs:
        - "/node_modules"

    - action: "Upload files to Lightsail"
      type: "RSYNC"
      local_path: "/"
      remote_path: "/home/admin/demo-store"
      targets:
        - lightsail-server
      recursive: true
      deployment_excludes:
        - ".git"
        - "node_modules"

    - action: "Install dependencies on server"
      type: "SSH_COMMAND"
      targets:
        - lightsail-server
      commands: |-
        cd /home/admin/demo-store
        npm ci --omit=dev

    - action: "Restart PM2"
      type: "SSH_COMMAND"
      targets:
        - lightsail-server
      commands: |-
        sudo pm2 restart all
        sudo pm2 save
